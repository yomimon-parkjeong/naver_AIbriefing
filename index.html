<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 시트 업로더 & 뷰어</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Modal Animation */
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-zoomIn {
            animation: zoomIn 0.3s ease-out forwards;
        }

        /* Toast Animation */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInRight 0.3s ease-out forwards;
        }
        
        /* Paste Area Transition */
        .paste-area-transition {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-slate-800">

    <div id="uploadForm" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-8 transition-all duration-300">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 rounded-full mb-3">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">데이터 등록 시스템</h2>
            <p class="text-sm text-slate-500 mt-1">구글 시트로 데이터를 빠르게 전송하세요.</p>
        </div>

        <div class="space-y-4">
            <!-- Keyword Input -->
            <div>
                <label for="keyword" class="block text-sm font-semibold text-slate-700 mb-1">AI 브리핑 키워드</label>
                <input type="text" id="keyword" placeholder="키워드를 입력하세요" 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
            </div>

            <!-- URL Input -->
            <div>
                <label for="url" class="block text-sm font-semibold text-slate-700 mb-1">검색 URL</label>
                <input type="text" id="url" placeholder="https://..." 
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
            </div>

            <!-- Paste Area -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">캡처본 붙여넣기</label>
                <div id="pasteArea" 
                    class="paste-area-transition w-full border-2 border-dashed border-blue-300 bg-blue-50/50 hover:bg-blue-50 rounded-lg p-6 sm:p-8 flex flex-col items-center justify-center cursor-pointer text-center group">
                    <svg class="w-8 h-8 text-blue-400 group-hover:text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <span class="text-sm font-medium text-blue-600" id="pasteText">이곳을 클릭 후 <kbd class="px-2 py-1 bg-white border border-slate-200 rounded-md shadow-sm text-xs font-sans text-slate-600 mx-1">Ctrl + V</kbd> 를 누르세요</span>
                </div>
                
                <!-- Image Preview -->
                <div id="previewContainer" class="hidden mt-4 relative rounded-lg border border-slate-200 bg-slate-50 p-2">
                    <div class="absolute top-3 right-3 flex space-x-1">
                        <span class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">이미지 로드됨</span>
                    </div>
                    <img id="imgPreview" class="w-full max-h-48 object-contain rounded" alt="Preview">
                </div>
            </div>

            <!-- Submit Button -->
            <button id="submitBtn" onclick="submitData()" 
                class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transform transition-all active:scale-[0.98] flex justify-center items-center">
                <span>구글 시트로 전송</span>
                <svg id="submitSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- 대시보드 뷰 (기본 숨김) -->
    <div id="dashboardView" class="hidden bg-white rounded-2xl shadow-xl w-full max-w-4xl p-6 sm:p-8 transition-all duration-300 animate-zoomIn">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div>
                <div class="inline-flex items-center justify-center w-10 h-10 bg-green-100 rounded-full mb-2">
                    <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">현재 등록 현황</h2>
                <p class="text-sm text-slate-500 mt-1">구글 시트에 성공적으로 기록된 데이터입니다.</p>
            </div>
            <button onclick="resetToForm()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors flex items-center shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                새로 등록하기
            </button>
        </div>
        
        <div class="overflow-x-auto rounded-lg border border-slate-200">
            <table class="w-full text-left border-collapse min-w-[600px]">
                <thead class="bg-slate-50">
                    <tr class="border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                        <th class="py-3 px-4 font-semibold w-1/6">등록 일시</th>
                        <th class="py-3 px-4 font-semibold w-1/4">키워드</th>
                        <th class="py-3 px-4 font-semibold w-2/4">검색 URL</th>
                        <th class="py-3 px-4 font-semibold w-1/6 text-center">캡처본</th>
                    </tr>
                </thead>
                <tbody id="dashboardTableBody" class="bg-white divide-y divide-slate-100">
                    <!-- Data rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-slate-900/90 backdrop-blur-sm flex-col items-center justify-center p-4">
        <button onclick="closeModal()" class="absolute top-4 right-4 sm:top-8 sm:right-8 p-2 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full transition-colors">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        
        <div id="loading" class="flex flex-col items-center text-white">
            <svg class="animate-spin h-10 w-10 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-lg font-medium tracking-wide text-slate-200">이미지 불러오는 중...</span>
        </div>
        
        <img id="modalImg" class="hidden max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl animate-zoomIn" alt="Shared Image">
    </div>

    <div id="toastContainer" class="fixed top-4 right-4 z-[1000] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // ⚠️ 구글 Apps Script 웹 앱 배포 URL이 적용되었습니다.
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyIIk86gOHzEqYv_KaymyvvAenftNTcApxMzCyJZMD3c0KIr8jnkbCSkIR5lh8OTfqusg/exec"; 
        
        let base64Image = "";

        // Custom Toast Notification System (Replaces alert)
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            // Base styles
            toast.className = 'toast-enter pointer-events-auto flex items-center p-4 rounded-lg shadow-lg max-w-sm w-full border-l-4 bg-white text-slate-800';
            
            // Icon & Color based on type
            let iconHtml = '';
            if (type === 'success') {
                toast.classList.add('border-green-500');
                iconHtml = `<svg class="w-6 h-6 text-green-500 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else if (type === 'error') {
                toast.classList.add('border-red-500');
                iconHtml = `<svg class="w-6 h-6 text-red-500 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else {
                toast.classList.add('border-blue-500');
                iconHtml = `<svg class="w-6 h-6 text-blue-500 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            }

            toast.innerHTML = `
                ${iconHtml}
                <p class="text-sm font-medium">${message}</p>
                <button onclick="this.parentElement.remove()" class="ml-auto text-slate-400 hover:text-slate-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            `;
            
            container.appendChild(toast);
            
            // Remove after 4 seconds
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    toast.style.transition = 'all 0.3s ease-out';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // 클립보드 이미지 붙여넣기 감지
        const pasteArea = document.getElementById('pasteArea');
        const pasteText = document.getElementById('pasteText');
        const keywordInput = document.getElementById('keyword');
        const urlInput = document.getElementById('url');
        const previewContainer = document.getElementById('previewContainer');
        const imgPreview = document.getElementById('imgPreview');

        pasteArea.addEventListener('click', () => {
            // Remove focus from inputs so paste event hits the document body reliably
            keywordInput.blur();
            urlInput.blur();
            showToast("Ctrl + V 를 눌러 이미지를 붙여넣으세요.", "info");
        });

        window.addEventListener('paste', function(e) {
            // If focused on an input, don't intercept unless we specifically want to
            if(document.activeElement === keywordInput || document.activeElement === urlInput) {
                return; // Let standard text paste happen
            }

            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let imageFound = false;

            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    imageFound = true;
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    
                    reader.onload = function(event) {
                        base64Image = event.target.result;
                        
                        // Update UI
                        imgPreview.src = base64Image;
                        previewContainer.classList.remove('hidden');
                        
                        // Style paste area as "success"
                        pasteArea.classList.remove('border-blue-300', 'bg-blue-50/50', 'hover:bg-blue-50');
                        pasteArea.classList.add('border-green-400', 'bg-green-50/50');
                        pasteArea.querySelector('svg').classList.replace('text-blue-400', 'text-green-500');
                        pasteText.innerHTML = "✅ 이미지 인식 완료! 다시 붙여넣어 변경 가능합니다.";
                        pasteText.classList.replace('text-blue-600', 'text-green-600');
                        
                        showToast("이미지가 성공적으로 첨부되었습니다.", "success");
                    };
                    reader.readAsDataURL(blob);
                    break; // Handle first image only
                }
            }

            if (!imageFound) {
                showToast("클립보드에 이미지가 없습니다.", "error");
            }
        });

        // 구글 시트로 데이터 전송
        function submitData() {
            const keyword = keywordInput.value.trim();
            const url = urlInput.value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const submitSpinner = document.getElementById('submitSpinner');
            const btnText = submitBtn.querySelector('span');

            // Validation
            if (!keyword || !url || !base64Image) {
                showToast("모든 필드를 입력하고 이미지를 붙여넣어 주세요.", "error");
                
                if (!keyword) keywordInput.focus();
                else if (!url) urlInput.focus();
                
                return;
            }

            // URL Validation (basic)
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showToast("올바른 URL 형식(http:// 또는 https://)을 입력해주세요.", "error");
                urlInput.focus();
                return;
            }

            // Set loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.innerText = "전송 중...";
            submitSpinner.classList.remove('hidden');

            showToast("구글 시트로 데이터를 전송하고 있습니다...", "info");

            // API Call
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ keyword: keyword, url: url, image: base64Image })
            })
            .then(res => {
                if(!res.ok) throw new Error("Network response was not ok");
                return res.json();
            })
            .then(data => {
                if(data.result === "success") {
                    showToast("성공적으로 등록되었습니다!", "success");
                    showDashboard(keyword, url, base64Image);
                    resetButtonState();
                } else {
                    showToast("오류 발생: " + (data.error || "알 수 없는 오류"), "error");
                    resetButtonState();
                }
            })
            .catch(err => {
                console.error(err);
                showToast("네트워크 오류가 발생했습니다. Apps Script 설정을 확인하세요.", "error");
                resetButtonState();
            });

            function resetButtonState() {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.innerText = "구글 시트로 전송";
                submitSpinner.classList.add('hidden');
            }
        }

        // 구글 시트에서 클릭해 들어왔을 때 자동으로 팝업 띄우기 (뷰어 기능)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const imgId = urlParams.get('imgId');
            
            if (imgId) {
                // 등록 폼은 숨기고 팝업 모달만 활성화
                document.getElementById('uploadForm').style.display = 'none';
                const modal = document.getElementById('imageModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                
                const loadingIndicator = document.getElementById('loading');
                const modalImg = document.getElementById('modalImg');
                
                // 구글 드라이브로부터 이미지 원본 데이터 호출
                fetch(`${WEB_APP_URL}?imgId=${imgId}`)
                .then(res => {
                    if(!res.ok) throw new Error("Fetch failed");
                    return res.json();
                })
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    
                    loadingIndicator.style.display = 'none';
                    modalImg.src = `data:${data.mimeType || 'image/png'};base64,${data.base64}`;
                    modalImg.classList.remove('hidden');
                })
                .catch(err => {
                    loadingIndicator.innerHTML = `
                        <div class="text-red-400 mb-2">
                            <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <span class="text-lg font-medium tracking-wide text-slate-200 text-center px-4">
                            이미지를 불러오는데 실패했습니다.<br>
                            <span class="text-sm text-slate-400 mt-2 block">권한을 확인하거나 ID가 유효한지 확인하세요.</span>
                        </span>
                    `;
                });
            }
        }

        // 대시보드 화면 표시 함수
        function showDashboard(keyword, url, imgSrc) {
            // 폼 숨기기 및 대시보드 표시
            document.getElementById('uploadForm').style.display = 'none';
            document.getElementById('dashboardView').classList.remove('hidden');
            
            const tbody = document.getElementById('dashboardTableBody');
            
            // 현재 시간 생성
            const now = new Date();
            const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            // 새 행 생성하여 상단에 추가 (최신 데이터가 위로 오도록)
            const newRow = document.createElement('tr');
            newRow.className = 'hover:bg-slate-50 transition-colors group';
            newRow.innerHTML = `
                <td class="py-4 px-4 text-sm text-slate-500 whitespace-nowrap">${timeString}</td>
                <td class="py-4 px-4 text-sm font-semibold text-slate-900">${keyword}</td>
                <td class="py-4 px-4 text-sm text-blue-600 truncate max-w-[200px] sm:max-w-xs">
                    <a href="${url}" target="_blank" class="hover:underline flex items-center">
                        <span class="truncate">${url}</span>
                        <svg class="w-3 h-3 ml-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </td>
                <td class="py-4 px-4 text-center">
                    <img src="${imgSrc}" class="h-12 w-20 object-cover rounded mx-auto border border-slate-200 cursor-pointer hover:opacity-80 transition-opacity shadow-sm" onclick="showLocalPreview('${imgSrc}')" alt="썸네일">
                </td>
            `;
            
            tbody.insertBefore(newRow, tbody.firstChild);
        }

        // 폼 상태 초기화 및 대시보드 닫기
        function resetToForm() {
            // 입력창 초기화
            keywordInput.value = '';
            urlInput.value = '';
            base64Image = '';
            
            // 이미지 미리보기 초기화
            previewContainer.classList.add('hidden');
            imgPreview.src = '';
            
            // 붙여넣기 영역 스타일 초기화
            pasteArea.classList.remove('border-green-400', 'bg-green-50/50');
            pasteArea.classList.add('border-blue-300', 'bg-blue-50/50', 'hover:bg-blue-50');
            pasteArea.querySelector('svg').classList.replace('text-green-500', 'text-blue-400');
            pasteText.innerHTML = '이곳을 클릭 후 <kbd class="px-2 py-1 bg-white border border-slate-200 rounded-md shadow-sm text-xs font-sans text-slate-600 mx-1">Ctrl + V</kbd> 를 누르세요';
            pasteText.classList.replace('text-green-600', 'text-blue-600');
            
            // 화면 전환
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('uploadForm').style.display = 'block';
            
            keywordInput.focus();
        }

        // 대시보드에서 썸네일 클릭 시 로컬 팝업 표시
        function showLocalPreview(src) {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            document.getElementById('loading').style.display = 'none';
            
            const modalImg = document.getElementById('modalImg');
            modalImg.src = src;
            modalImg.classList.remove('hidden');
        }

        // 팝업 닫기 함수 수정 (대시보드와 충돌 방지)
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            
            // 외부(구글 시트)에서 URL 파라미터를 통해 들어온 경우에만 폼으로 돌아가는 폴백 실행
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('imgId')) {
                try {
                    window.close();
                } catch (e) {
                    console.log("Cannot close window natively.");
                }
                
                setTimeout(() => {
                    document.getElementById('uploadForm').style.display = 'block';
                    window.history.replaceState({}, document.title, window.location.pathname);
                }, 300);
            }
        }
    </script>
</body>
</html>
