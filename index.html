<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 등록 & 대시보드 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* 기본 배경 및 폰트 설정 */
        body { background-color: #f1f5f9; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
        
        /* 폼 컨테이너 미세 조정 */
        .glass-panel { background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        
        /* 💡 말풍선 겹침 해결 & 시인성 개선 */
        .naver-search-group { position: relative; display: flex; align-items: stretch; gap: 8px; }
        .bounce-tooltip {
            position: absolute;
            bottom: calc(100% + 12px);
            right: 0;
            background-color: #03c75a; 
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(3, 199, 90, 0.3);
            animation: bounceSoft 1.5s infinite;
            pointer-events: none;
            z-index: 10;
        }
        .bounce-tooltip::after {
            content: ''; position: absolute; top: 100%; right: 24px;
            border-width: 6px; border-style: solid; 
            border-color: #03c75a transparent transparent transparent;
        }
        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 💡 [등록내역보기] 독립 박스 스타일 */
        .history-box {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px 20px;
            margin-top: 36px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .history-box:hover { border-color: #94a3b8; background-color: #f1f5f9; }

        /* 캡처본 붙여넣기 영역 */
        .paste-area { border: 2px dashed #3b82f6; transition: all 0.2s ease; }
        .paste-area:hover { background-color: #eff6ff; border-color: #2563eb; }

        /* 토스트 알림창 */
        .toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            padding: 14px 28px; border-radius: 50px; color: white; font-weight: bold;
            transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .toast.show { bottom: 40px; }
        
        /* 화면 전환 처리 */
        #dashboardView, #imageModal { display: none; }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center py-12 px-4 min-h-screen">

    <!-- 1. 데이터 등록 폼 -->
    <div id="uploadForm" class="glass-panel w-full max-w-lg rounded-2xl overflow-hidden border border-gray-100">
        <div class="bg-blue-600 text-white py-5 px-6 text-center border-b border-blue-700">
            <h2 class="text-2xl font-bold tracking-tight">📊 데이터 등록 시스템</h2>
        </div>
        
        <div class="p-8 space-y-7">
            <!-- 키워드 & 네이버 검색 버튼 영역 -->
            <div class="space-y-2">
                <label class="block text-sm font-bold text-gray-700">AI 브리핑 키워드</label>
                <div class="naver-search-group">
                    <input type="text" id="keyword" placeholder="키워드를 입력하세요" 
                        class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    
                    <button onclick="openNaverSearch()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-5 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2 relative">
                        <div class="bounce-tooltip">입력 키워드 미리보기</div>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        검색
                    </button>
                </div>
            </div>

            <!-- 검색 URL -->
            <div class="space-y-2">
                <label class="block text-sm font-bold text-gray-700">검색 URL</label>
                <input type="text" id="url" placeholder="https://..." 
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <!-- 캡처본 붙여넣기 영역 -->
            <div class="space-y-2">
                <label class="block text-sm font-bold text-gray-700">이미지 등록</label>
                <div id="pasteArea" class="paste-area bg-gray-50 rounded-xl p-10 text-center cursor-pointer flex flex-col items-center justify-center gap-3">
                    <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span class="text-blue-600 font-bold text-lg">이곳을 클릭 후 Ctrl + V 를 누르세요</span>
                    <span class="text-gray-400 text-sm">또는 클립보드에 이미지를 복사해오세요</span>
                </div>
                <div class="flex justify-center mt-4">
                    <img id="imgPreview" class="max-h-56 rounded-lg shadow-md hidden border border-gray-200">
                </div>
            </div>

            <!-- 전송 버튼 -->
            <button onclick="submitData()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-lg flex items-center justify-center gap-2 mt-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                구글 시트로 전송
            </button>

            <!-- [등록내역보기] 독립 박스 처리 -->
            <div class="history-box">
                <h3 class="text-gray-700 font-extrabold text-lg mb-1">데이터베이스 열람</h3>
                <p class="text-sm text-gray-500 mb-5">현재까지 구글 시트에 누적된 모든 데이터를 확인합니다.</p>
                <button onclick="loadHistory()" id="historyBtn" class="w-full bg-white hover:bg-gray-100 text-gray-800 border-2 border-gray-300 font-bold py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    [ 누적 등록 내역 보기 ]
                </button>
            </div>
        </div>
    </div>

    <!-- 2. 대시보드 화면 -->
    <div id="dashboardView" class="glass-panel w-full max-w-6xl rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="bg-gray-800 text-white py-5 px-8 flex justify-between items-center">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                현재 등록 현황 대시보드
            </h2>
            <button onclick="resetForm()" class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                새로 등록하기
            </button>
        </div>
        
        <div class="p-8 overflow-x-auto">
            <div id="dashboardLoading" class="text-center py-16 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mx-auto mb-4"></div>
                <p class="text-gray-600 font-bold">시트 데이터를 불러오는 중입니다...</p>
            </div>
            
            <div id="dashboardError" class="hidden text-center py-12 bg-red-50 rounded-xl border border-red-200">
                <svg class="w-14 h-14 text-red-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-red-600 font-extrabold text-xl mb-2">내역을 불러오지 못했습니다.</p>
                <p id="errorDetail" class="text-sm text-red-500 mb-5 font-mono bg-red-100 p-2 inline-block rounded"></p>
                <br>
                <p class="text-sm text-gray-700 bg-white inline-block p-4 rounded-lg shadow-sm font-semibold border border-gray-200">
                    💡 Apps Script 배포 시 버전을 <span class="text-blue-600 font-bold">[새 버전(New version)]</span>으로 갱신했는지 반드시 확인해주세요!
                </p>
            </div>
            
            <table class="w-full text-left border-collapse" id="historyTable">
                <thead>
                    <tr class="bg-gray-100 border-b-2 border-gray-300 text-gray-700 text-sm">
                        <th class="p-4 font-bold w-1/5 text-center rounded-tl-lg">등록일시</th>
                        <th class="p-4 font-bold w-1/4">키워드</th>
                        <th class="p-4 font-bold w-1/3">검색 URL</th>
                        <th class="p-4 font-bold w-auto text-center rounded-tr-lg">이미지 뷰어</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody" class="divide-y divide-gray-200 bg-white">
                    <!-- Javascript 로우 데이터 주입 영역 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 3. 이미지 뷰어 모달 -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-gray-900 bg-opacity-95 flex items-center justify-center backdrop-filter backdrop-blur-sm">
        <span onclick="closeModal()" class="absolute top-8 right-10 text-white text-5xl font-light cursor-pointer hover:text-red-400 transition-colors">&times;</span>
        <div id="modalLoading" class="text-white text-xl font-bold animate-pulse">이미지 원본 불러오는 중...</div>
        <img id="modalImg" class="max-w-[90%] max-h-[90%] rounded-xl shadow-2xl hidden object-contain border-4 border-gray-700">
    </div>

    <!-- 4. 토스트 알림창 -->
    <div id="toastContainer" class="toast"></div>

    <script>
        // 백엔드 연동 URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyIIk86gOHzEqYv_KaymyvvAenftNTcApxMzCyJZMD3c0KIr8jnkbCSkIR5lh8OTfqusg/exec";
        let base64Image = "";

        // 💡 [보안 패치] HTML 특수문자 변환 (XSS 방지용)
        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        /* ==========================================
           기능 1: 네이버 검색 새창 띄우기
        ========================================== */
        function openNaverSearch() {
            const keyword = document.getElementById('keyword').value.trim();
            if (!keyword) {
                showToast("먼저 검색할 키워드를 입력해주세요!", "error");
                document.getElementById('keyword').focus();
                return;
            }
            const naverUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(keyword)}`;
            window.open(naverUrl, '_blank');
        }

        /* ==========================================
           기능 2: 클립보드 이미지 붙여넣기
        ========================================== */
        document.getElementById('pasteArea').addEventListener('click', () => {
            document.getElementById('keyword').blur();
            document.getElementById('url').blur();
        });

        window.addEventListener('paste', function(e) {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        base64Image = event.target.result;
                        const img = document.getElementById('imgPreview');
                        img.src = base64Image;
                        img.style.display = 'block';
                        document.getElementById('pasteArea').innerHTML = "<span class='text-blue-600 font-bold text-lg'>✅ 이미지 인식 완료!</span><span class='text-gray-500 text-sm'>다시 붙여넣어 변경할 수 있습니다.</span>";
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        /* ==========================================
           기능 3: 데이터 제출 (CORS 안정성 패치 포함)
        ========================================== */
        function submitData() {
            const keyword = document.getElementById('keyword').value.trim();
            const url = document.getElementById('url').value.trim();
            const btn = document.getElementById('submitBtn');

            if(!keyword || !url || !base64Image) {
                showToast("모든 필드를 입력하고 이미지를 붙여넣어 주세요.", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 구글 시트로 전송 중...`;

            fetch(WEB_APP_URL, {
                method: 'POST',
                // 💡 [안정성 패치] CORS Preflight 회피를 위한 헤더 추가
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ keyword: keyword, url: url, image: base64Image })
            })
            .then(res => res.json())
            .then(data => {
                if(data.result === "success") {
                    showToast("성공적으로 등록되었습니다!", "success");
                    loadHistory();
                } else {
                    showToast("오류 발생: " + data.error, "error");
                    btn.disabled = false;
                    btn.innerHTML = "구글 시트로 전송";
                }
            }).catch(err => {
                showToast("네트워크 오류 발생!", "error");
                btn.disabled = false;
                btn.innerHTML = "구글 시트로 전송";
            });
        }

        /* ==========================================
           기능 4: 누적 데이터 불러오기
        ========================================== */
        function loadHistory() {
            document.getElementById('uploadForm').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            document.getElementById('dashboardLoading').style.display = 'block';
            document.getElementById('historyTable').style.display = 'none';
            document.getElementById('dashboardError').style.display = 'none';

            fetch(`${WEB_APP_URL}?action=getHistory`)
            .then(res => res.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (data.result === "success") {
                        renderTable(data.data);
                    } else {
                        throw new Error(data.error || "알 수 없는 API 에러");
                    }
                } catch (e) {
                    console.error("데이터 파싱 실패:", e, "원문:", text);
                    document.getElementById('dashboardLoading').style.display = 'none';
                    document.getElementById('dashboardError').style.display = 'block';
                    document.getElementById('errorDetail').innerText = `원인: 백엔드 응답 형식 오류 (새 버전 배포 누락 의심)\n원문: ${text.substring(0, 50)}...`;
                }
            })
            .catch(err => {
                document.getElementById('dashboardLoading').style.display = 'none';
                document.getElementById('dashboardError').style.display = 'block';
                document.getElementById('errorDetail').innerText = "네트워크 오류: " + err.message;
            });
        }

        /* ==========================================
           기능 5: 테이블 렌더링 (XSS 보안 패치 적용)
        ========================================== */
        function renderTable(historyList) {
            document.getElementById('dashboardLoading').style.display = 'none';
            document.getElementById('historyTable').style.display = 'table';
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            if(historyList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500 font-semibold">아직 등록된 데이터가 없습니다.</td></tr>`;
                return;
            }

            historyList.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 transition-colors";
                
                // 💡 [보안 패치] escapeHTML을 사용하여 악성 스크립트 실행을 방지
                tr.innerHTML = `
                    <td class="p-4 text-center text-sm text-gray-600">${escapeHTML(item.date)}</td>
                    <td class="p-4 font-bold text-gray-800">${escapeHTML(item.keyword)}</td>
                    <td class="p-4"><a href="${escapeHTML(item.url)}" target="_blank" class="text-blue-500 hover:text-blue-700 underline text-sm break-all">${escapeHTML(item.url)}</a></td>
                    <td class="p-4 text-center">
                        <button onclick="openViewer('${escapeHTML(item.imgId)}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                            📷 사진 보기
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 뷰어 모달 열기
        function openViewer(imgId) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const loading = document.getElementById('modalLoading');
            
            modal.style.display = 'flex';
            modalImg.style.display = 'none';
            loading.style.display = 'block';
            loading.innerText = "이미지 원본 불러오는 중...";

            fetch(`${WEB_APP_URL}?imgId=${imgId}`)
            .then(res => res.json())
            .then(data => {
                loading.style.display = 'none';
                modalImg.src = `data:${data.mimeType};base64,${data.base64}`;
                modalImg.style.display = 'block';
            })
            .catch(err => {
                loading.innerText = "이미지 호출 실패 (권한 문제 등)";
            });
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('modalImg').src = "";
        }

        // 폼 초기화 후 다시 입력 화면으로
        function resetForm() {
            document.getElementById('keyword').value = "";
            document.getElementById('url').value = "";
            base64Image = "";
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('imgPreview').src = "";
            document.getElementById('pasteArea').innerHTML = `
                <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="text-blue-600 font-bold text-lg">이곳을 클릭 후 Ctrl + V 를 누르세요</span>
            `;
            const btn = document.getElementById('submitBtn');
            btn.disabled = false;
            btn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg> 구글 시트로 전송`;
            
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('uploadForm').style.display = 'block';
        }

        // 토스트 알림 함수
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastContainer');
            toast.innerText = message;
            toast.style.backgroundColor = type === 'success' ? '#10b981' : '#ef4444';
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
